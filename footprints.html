  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #09090b;
      --surface:  #111113;
      --border:   #27272a;
      --text:     #fafafa;
      --mid:      #a1a1aa;
      --soft:     #52525b;
      --accent:   #6366f1;
      --accent2:  #8b5cf6;
      --glow:     rgba(99,102,241,.18);
      --dot:      #27272a;
      --mono:     "SFMono-Regular","Menlo","Consolas",monospace;
      --max:      980px;
    }
    [data-theme="light"] {
      --bg:        #f8f8f8;
      --surface:   #ffffff;
      --border:    #e4e4e7;
      --text:      #18181b;
      --mid:       #52525b;
      --soft:      #71717a;
      --glow:      rgba(99,102,241,.12);
      --dot:       #d4d4d8;
      --name-start:#18181b;
      --nav-bg:    rgba(248,248,248,.85);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
      background-size: 28px 28px;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(99,102,241,.12), transparent 70%),
                  linear-gradient(to bottom, transparent 60%, var(--bg) 100%);
      pointer-events: none;
    }
    a { color: inherit; text-decoration: none; }

    /* ── NAV ─────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 54px;
      background: var(--nav-bg, rgba(9,9,11,.75));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      height: 100%; max-width: 1200px; margin: 0 auto;
      padding: 0 2.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-back {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 13px; color: var(--soft); transition: color .2s;
    }
    .nav-back:hover { color: var(--text); }
    .nav-title {
      font-size: 13px; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase;
      background: linear-gradient(90deg, var(--text), var(--mid));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-right { display: flex; align-items: center; gap: 1.25rem; }
    .theme-toggle {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      color: var(--soft); cursor: pointer; padding: 0.3rem 0.45rem;
      display: flex; align-items: center; transition: color .2s, border-color .2s;
      line-height: 0;
    }
    .theme-toggle:hover { color: var(--text); border-color: var(--soft); }

    /* ── LAYOUT ──────────────────────────────────────── */
    .wrap { position: relative; z-index: 1; max-width: var(--max); margin: 0 auto; padding: 0 2rem; }
    .page { padding-top: 7rem; padding-bottom: 4rem; }

    .header { text-align: center; margin-bottom: 2.5rem; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--soft); margin-bottom: 1.1rem;
    }
    .eyebrow::before, .eyebrow::after {
      content: ""; width: 18px; height: 1px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }
    .title {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700; line-height: 1.05; letter-spacing: -0.03em;
      margin-bottom: 0.8rem;
      background: linear-gradient(135deg, var(--name-start, #fff) 30%, var(--accent) 70%, var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { font-size: 1rem; color: var(--mid); }

    /* ── STATS ───────────────────────────────────────── */
    .stats {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 2.5rem;
      margin: 2.5rem 0 1.5rem;
    }
    .stat { text-align: center; }
    .stat-num {
      font-size: 2rem; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--soft); margin-top: 0.2rem;
    }

    /* ── GLOBE ───────────────────────────────────────── */
    .globe-holder {
      position: relative; z-index: 1;
      width: 100%; height: min(68vh, 620px);
      min-height: 380px;
      display: flex; align-items: center; justify-content: center;
      cursor: grab;
    }
    .globe-holder:active { cursor: grabbing; }
    .globe-holder canvas { outline: none; }

    .legend {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 1.25rem;
      margin: 1.5rem 0 0;
    }
    .legend-item {
      display: inline-flex; align-items: center; gap: 0.45rem;
      font-size: 12px; color: var(--mid);
    }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }

    .hint {
      text-align: center; font-size: 12px; color: var(--soft);
      font-family: var(--mono); margin-top: 0.75rem; letter-spacing: 0.02em;
    }

    /* globe.gl tooltip */
    .globe-tip {
      font-family: -apple-system, "Inter", sans-serif;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.55rem 0.8rem; max-width: 220px;
      box-shadow: 0 8px 28px rgba(0,0,0,.35);
    }
    .globe-tip .t-name { font-size: 13px; font-weight: 600; }
    .globe-tip .t-meta { font-size: 11px; color: var(--soft); font-family: var(--mono); margin-top: 2px; }
    .globe-tip .t-note { font-size: 12px; color: var(--mid); margin-top: 5px; line-height: 1.5; }
    .globe-tip .t-type {
      display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; margin-top: 6px; padding: 2px 7px; border-radius: 4px;
    }

    /* ── COUNTRY ACCORDION ───────────────────────────── */
    .places { margin-top: 4rem; }
    .places-label {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--soft); margin-bottom: 1.5rem;
    }
    .places-label::before { content: ""; width: 18px; height: 1px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

    .country-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 0.6rem;
    }
    .country-card {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.9rem 1rem; border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface); cursor: pointer;
      width: 100%; font: inherit; color: inherit; text-align: left;
      transition: border-color .2s, transform .15s, box-shadow .2s;
    }
    .country-card:hover { border-color: var(--soft); transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.18); }
    .country-flag {
      width: 32px; height: 24px; border-radius: 5px; flex-shrink: 0;
      background: var(--bg); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
      font-family: var(--mono); color: var(--mid);
    }
    .cc-body { flex: 1; min-width: 0; }
    .cc-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .cc-count { font-size: 11.5px; color: var(--soft); font-family: var(--mono); margin-top: 1px; }
    .cc-bar {
      height: 4px; border-radius: 99px; margin-top: 6px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      opacity: 0.55;
    }
    .cc-dots { display: flex; gap: 4px; flex-shrink: 0; }
    .cc-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }

    /* ── FOOTER ──────────────────────────────────────── */
    footer { padding: 2.5rem 0; border-top: 1px solid var(--border); position: relative; z-index: 1; margin-top: 4rem; }
    .footer-inner {
      max-width: var(--max); margin: 0 auto; padding: 0 2rem;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: var(--soft);
    }

    @media (max-width: 600px) {
      .nav-inner { padding: 0 1.25rem; }
      .wrap { padding: 0 1.25rem; }
      .page { padding-top: 5.5rem; }
      .stats { gap: 1.5rem; }
      .stat-num { font-size: 1.6rem; }
      .globe-holder { height: 56vh; min-height: 320px; }
      .footer-inner { flex-direction: column; gap: 0.5rem; text-align: center; }
    }
  </style>
</head>

/* category meta — colours mirror the site palette */
const TYPES = {
  home:    { label: "Home",    color: "#f59e0b" },
  lived:   { label: "Lived",   color: "#6366f1" },
  worked:  { label: "Worked",  color: "#8b5cf6" },
  visited: { label: "Visited", color: "#34d399" },
};

/* country → continent (for the stat) */
const CONTINENT = {
  "Germany":"Europe","Netherlands":"Europe","France":"Europe","Czechia":"Europe",
  "Italy":"Europe","Spain":"Europe","Switzerland":"Europe","Portugal":"Europe",
  "Greece":"Europe","Slovenia":"Europe","Sweden":"Europe","Austria":"Europe",
  "Liechtenstein":"Europe","Poland":"Europe","China":"Asia","Turkey":"Asia",
};
const continentOf = c => CONTINENT[c] || "—";

/* short codes for the country badges */
const CODE = {
  "Germany":"DE","China":"CN","Netherlands":"NL","Spain":"ES","Czechia":"CZ",
  "Italy":"IT","Slovenia":"SI","Greece":"GR","Switzerland":"CH","France":"FR",
  "Portugal":"PT","Turkey":"TR","Sweden":"SE","Austria":"AT",
  "Liechtenstein":"LI","Poland":"PL",
};

const order = { home:0, lived:1, worked:2, visited:3 };

/* ── STATS ──────────────────────────────────────────────── */
const stats = {
  cities:     new Set(PLACES.map(p => p.name)).size,
  countries:  new Set(PLACES.map(p => p.country)).size,
  continents: new Set(PLACES.map(p => continentOf(p.country)).filter(c => c !== "—")).size,
};
function countUp(el, target) {
  const dur = 900, t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
document.querySelectorAll('[data-stat]').forEach(el => countUp(el, stats[el.dataset.stat]));

/* ── LEGEND ─────────────────────────────────────────────── */
const usedTypes = [...new Set(PLACES.map(p => p.type))].sort((a, b) => order[a] - order[b]);
document.getElementById('legend').innerHTML = usedTypes
  .map(t => `<span class="legend-item"><span class="legend-dot" style="color:${TYPES[t].color};background:${TYPES[t].color}"></span>${TYPES[t].label}</span>`)
  .join('');

/* ── COUNTRY CARDS (countries only — no city names listed) ─ */
const groups = {};
PLACES.forEach(p => (groups[p.country] = groups[p.country] || []).push(p));

const entries = Object.entries(groups).sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
const maxCities = Math.max(...entries.map(([, c]) => c.length));
const grid = document.getElementById('country-grid');

entries.forEach(([country, cities]) => {
  const types = [...new Set(cities.map(c => c.type))].sort((a, b) => order[a] - order[b]);
  const lat = cities.reduce((s, c) => s + c.lat, 0) / cities.length;   // country centroid (camera only)
  const lng = cities.reduce((s, c) => s + c.lng, 0) / cities.length;

  const btn = document.createElement('button');
  btn.className = 'country-card';
  btn.innerHTML =
    `<span class="country-flag">${CODE[country] || '··'}</span>
     <span class="cc-body">
       <span class="cc-name">${country}</span>
       <span class="cc-count">${cities.length} cit${cities.length > 1 ? 'ies' : 'y'}</span>
       <span class="cc-bar" style="width:${Math.round(18 + 82 * cities.length / maxCities)}%"></span>
     </span>
     <span class="cc-dots">${types.map(t => `<span class="cc-dot" style="color:${TYPES[t].color};background:${TYPES[t].color}"></span>`).join('')}</span>`;
  btn.addEventListener('click', () => flyTo({ lat, lng }));
  grid.appendChild(btn);
});

/* ── GLOBE (texture-free contours, light on resources) ──── */
const el = document.getElementById('globe');
let BORDER = '#6366f1', LAND = 'rgba(0,0,0,0)';

const globe = Globe({
    animateIn: false,
    rendererConfig: { antialias: true, alpha: true, powerPreference: 'low-power' },
  })(el)
  .backgroundColor('rgba(0,0,0,0)')
  .showAtmosphere(true)
  .atmosphereColor('#6366f1')
  .atmosphereAltitude(0.14)
  /* country contour outlines — transparent fill + thin border stroke */
  .polygonAltitude(0.006)
  .polygonCapColor(() => LAND)
  .polygonSideColor(() => 'rgba(0,0,0,0)')
  .polygonStrokeColor(() => BORDER)
  .polygonsTransitionDuration(0)
  /* one marker per city, colour-coded by type */
  .pointsData(PLACES)
  .pointLat('lat').pointLng('lng')
  .pointColor(d => TYPES[d.type].color)
  .pointAltitude(d => d.type === 'visited' ? 0.04 : 0.07)
  .pointRadius(d => d.type === 'visited' ? 0.3 : 0.42)
  .pointResolution(6)
  .pointLabel(d => {
    const t = TYPES[d.type];
    return `<div class="globe-tip">
        <div class="t-name">${d.name}</div>
        <div class="t-meta">${d.country}</div>
        ${d.note ? `<div class="t-note">${d.note}</div>` : ''}
        <span class="t-type" style="color:${t.color};background:${t.color}22;">${t.label}</span>
      </div>`;
  })
  .onPointClick(d => flyTo(d));

const globeMat = globe.globeMaterial();
globeMat.shininess = 6;

/* load low-res country borders once (110m TopoJSON ~110 KB, cached) */
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
  .then(r => r.json())
  .then(topo => globe.polygonsData(topojson.feature(topo, topo.objects.countries).features))
  .catch(() => {});

/* cap pixel ratio on hi-dpi screens — large GPU saving, no visible loss */
try { globe.renderer().setPixelRatio(Math.min(1.5, window.devicePixelRatio || 1)); } catch (e) {}

/* gentle auto-rotation */
const controls = globe.controls();
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.enableZoom = true;
controls.minDistance = 180;
controls.maxDistance = 600;

/* open on a view that spans Europe → Asia */
globe.pointOfView({ lat: 38, lng: 55, altitude: 2.5 }, 0);

function flyTo(p) {
  controls.autoRotate = false;
  globe.pointOfView({ lat: p.lat, lng: p.lng, altitude: 1.5 }, 1100);
}

/* keep the globe sized to its container */
function sizeGlobe() { globe.width(el.clientWidth).height(el.clientHeight); }
sizeGlobe();
new ResizeObserver(sizeGlobe).observe(el);

/* ⚡ halt the render loop whenever the globe is off-screen or the tab is hidden */
let onScreen = true;
const setRunning = () => (onScreen && !document.hidden) ? globe.resumeAnimation() : globe.pauseAnimation();
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; setRunning(); }, { threshold: 0.02 }).observe(el);
document.addEventListener('visibilitychange', setRunning);

/* recolour the sphere + country contours to match the site theme */
function paintGlobe(theme) {
  if (theme === 'light') {
    globeMat.color.set('#ecedf6');
    globeMat.emissive.set('#d4d6ec');
    globeMat.emissiveIntensity = 0.85;
    BORDER = 'rgba(67,56,202,0.75)';
    LAND   = 'rgba(99,102,241,0.12)';
  } else {
    globeMat.color.set('#0a0a14');
    globeMat.emissive.set('#07070e');
    globeMat.emissiveIntensity = 0.4;
    BORDER = 'rgba(165,180,252,0.85)';
    LAND   = 'rgba(99,102,241,0.16)';
  }
  globe.polygonStrokeColor(() => BORDER).polygonCapColor(() => LAND);
}

/* ── THEME TOGGLE (shared with the rest of the site) ────── */
const MOON = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
const CRESCENT = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';

const root = document.documentElement;
const btn = document.getElementById('theme-toggle');
const icon = document.getElementById('theme-icon');

function applyTheme(t) {
  root.setAttribute('data-theme', t);
  icon.innerHTML = t === 'dark' ? MOON : CRESCENT;
  localStorage.setItem('theme', t);
  paintGlobe(t);
}

const saved = localStorage.getItem('theme');
const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
applyTheme(saved || sys);

btn.addEventListener('click', () => {
  applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
</script>

</body>
</html>
